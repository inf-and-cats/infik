<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Инфик</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Neucha&family=Nunito:wght@400;600;700;800&family=Marck+Script&family=JetBrains+Mono:wght@400;600&family=Press+Start+2P&display=swap">
<style>
/* Layout: one phone-width column, Duolingo-style path of lesson nodes; code always sits in a dark IDE window. */
:root{
  --bg:#f3f2ff; --surface:#ffffff; --surface-2:#e8e6fb; --line:#d9d6f3;
  --ink:#262b69; --ink-soft:#5d628f; --purple:#512da8; --purple-ink:#512da8;
  --lime:#ecf141; --lime-2:#cfeb62; --lilac:#a5a9e3;
  --good:#2f9e5b; --good-bg:#e4f7e9; --bad:#d6336c; --bad-bg:#fde8ef;
  --ide:#1c1f4f; --ide-2:#151842; --ide-line:#2d3170; --ide-text:#e9e8ff; --ide-dim:#6d72b3;
  --syn-fn:#ecf141; --syn-str:#b6f08a; --syn-num:#ffb86b; --syn-com:#7f84c2; --syn-kw:#c9a8ff; --syn-par:#a5a9e3;
  --f-display:"Neucha","Comic Sans MS",cursive;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-accent:"Marck Script","Segoe Script",cursive;
  --f-code:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12143a; --surface:#1c1f4f; --surface-2:#262a63; --line:#33387a;
  --ink:#ecebff; --ink-soft:#a5a9e3; --purple:#6a45d1; --purple-ink:#b9a2ff;
  --good:#5fd38d; --good-bg:#173d33; --bad:#ff6b9a; --bad-bg:#46193a;
  --ide:#0d0f2e; --ide-2:#090b24; --ide-line:#22265c; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#12143a; --surface:#1c1f4f; --surface-2:#262a63; --line:#33387a;
  --ink:#ecebff; --ink-soft:#a5a9e3; --purple:#6a45d1; --purple-ink:#b9a2ff;
  --good:#5fd38d; --good-bg:#173d33; --bad:#ff6b9a; --bad-bg:#46193a;
  --ide:#0d0f2e; --ide-2:#090b24; --ide-line:#22265c; color-scheme:dark;}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-block:12px 96px;display:flex;flex-direction:column;gap:20px}

/* top bar */
.top{display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand{font-family:var(--f-display);font-size:30px;line-height:1;color:var(--ink);letter-spacing:.01em}
.stats{display:flex;gap:8px}
.stat{display:flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 6px;font-weight:800;font-variant-numeric:tabular-nums;font-size:14px}
.stat svg{width:20px;height:20px;display:block}

.countdown{display:flex;align-items:center;gap:12px;background:#262b69;color:#f3f2ff;border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.countdown b{font-family:var(--f-display);font-size:34px;line-height:1;color:var(--lime);font-variant-numeric:tabular-nums}
.countdown span{font-size:14px;line-height:1.3;color:#f3f2ff}
.countdown em{font-family:var(--f-accent);font-style:normal;font-size:20px;color:var(--lime-2)}

/* module */
.module{position:relative;background:var(--lime);color:#262b69;border-radius:22px;padding:18px 18px 18px;overflow:hidden}
.module .eyebrow{font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.module h2{font-family:var(--f-display);font-size:32px;line-height:1.05;margin:4px 0 6px;text-wrap:balance;text-transform:uppercase;max-width:62%}
.module p{margin:0;font-size:14px;max-width:60%}
.module img{position:absolute;right:-18px;bottom:-26px;width:46%;max-width:200px;pointer-events:none}
.module .bar{margin-top:12px;height:10px;border-radius:99px;background:rgba(38,43,105,.18);max-width:58%;overflow:hidden}
.module .bar i{display:block;height:100%;background:#512da8;border-radius:99px;transition:width .4s}

.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding-block:6px}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:0}
.node .disc{width:76px;height:70px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-soft);box-shadow:0 7px 0 var(--line);transition:transform .1s}
.node:active .disc{transform:translateY(4px);box-shadow:0 3px 0 var(--line)}
.node .disc svg{width:34px;height:34px}
.node.open .disc{background:var(--purple);color:var(--lime);box-shadow:0 7px 0 #2f1873}
.node.done .disc{background:var(--lime);color:#262b69;box-shadow:0 7px 0 #a9b62a}
.node.boss .disc{width:92px;height:84px;border-radius:26px}
.node .lbl{font-weight:700;font-size:14px;color:var(--ink-soft);max-width:150px;text-align:center;line-height:1.25}
.node.open .lbl,.node.done .lbl{color:var(--ink)}
.node .start{position:absolute;top:-34px;background:var(--surface);border:2px solid var(--purple);color:var(--purple-ink);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:10px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}

.locked-mod{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:14px 16px;color:var(--ink-soft)}
.locked-mod b{display:block;color:var(--ink);font-size:16px}
.locked-mod small{font-size:13px}
.locked-mod .ege{margin-left:auto;font-size:12px;font-weight:800;background:var(--surface-2);border-radius:8px;padding:3px 8px;white-space:nowrap}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:center}
.tabs div{display:flex;gap:6px;width:100%;max-width:480px}
.tabs button{flex:1;border:0;background:none;border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--ink-soft)}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-selected="true"]{background:var(--surface-2);color:var(--purple-ink)}

h1.page{font-family:var(--f-display);font-size:34px;line-height:1.05;margin:0;text-transform:uppercase}
.sub{color:var(--ink-soft);margin:-12px 0 0;font-size:14px}
.league{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:28px 36px 1fr auto;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.row:last-child{border-bottom:0}
.row .pos{font-weight:800;color:var(--ink-soft);text-align:center}
.row .ava{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#262b69}
.row.me{background:var(--surface-2)}
.row.me .name{font-weight:800}
.row .xp{font-weight:800}
.zone{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--good);padding:6px 14px;background:var(--good-bg)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 8px;min-width:0}
.badge .ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-soft)}
.badge .ic svg{width:30px;height:30px}
.badge.on .ic{background:var(--lime);color:#512da8}
.badge b{font-size:13px;line-height:1.2}
.badge small{font-size:11px;color:var(--ink-soft);line-height:1.25}
.badge:not(.on){opacity:.7}
.note{font-size:13px;color:var(--ink-soft);margin:0}
.reset{align-self:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--ink-soft)}

/* lesson */
.lesson{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.lesson-in{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0}
.lhead{display:flex;align-items:center;gap:12px;padding-block:4px 10px}
.x{border:0;background:none;padding:4px;color:var(--ink-soft);display:grid;place-items:center}
.x svg{width:26px;height:26px}
.prog{flex:1;height:14px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--lime);border-radius:99px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08);transition:width .35s}
.lbody>*{flex:none}
.lbody{flex:1;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:16px;padding-block:8px 20px}
.kind{font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--purple-ink);display:flex;align-items:center;gap:8px}
.kind .again{background:var(--bad-bg);color:var(--bad);border-radius:6px;padding:1px 6px;letter-spacing:.04em}
.q{font-family:var(--f-display);font-size:28px;line-height:1.1;margin:0;text-wrap:balance}
.txt{margin:0;max-width:65ch}
.txt code,.opt code{font-family:var(--f-code);font-size:.9em;background:var(--surface-2);border-radius:6px;padding:1px 5px}
.tip{display:flex;gap:10px;align-items:flex-end}
.tip img{width:64px;flex:none}
.tip p{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 14px;font-size:15px}
.tip p em{font-family:var(--f-accent);font-style:normal;font-size:20px;color:var(--purple-ink);line-height:1}

/* IDE */
.ide{background:var(--ide);border-radius:14px;overflow:hidden;color:var(--ide-text);box-shadow:0 10px 30px -18px rgba(38,43,105,.8);min-width:0}
.ide-bar{display:flex;align-items:center;gap:8px;background:var(--ide-2);padding:8px 10px 8px 12px;font-family:var(--f-code);font-size:12px;color:var(--ide-dim)}
.dots{display:flex;gap:5px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--ide-line)}
.dots i:nth-child(1){background:#ff6b9a}.dots i:nth-child(2){background:#ecf141}.dots i:nth-child(3){background:#5fd38d}
.ide-bar .file{background:var(--ide);color:var(--ide-text);padding:3px 10px;border-radius:6px 6px 0 0;margin-bottom:-8px;padding-bottom:8px}
.run{margin-left:auto;border:0;background:var(--lime);color:#262b69;font-family:var(--f-body);font-weight:800;font-size:13px;border-radius:8px;padding:4px 10px;display:flex;align-items:center;gap:5px}
.run svg{width:12px;height:12px}
.code{display:grid;grid-template-columns:auto 1fr;font-family:var(--f-code);font-size:15px;line-height:26px;overflow-x:auto}
.gut{padding:10px 0;background:var(--ide);color:var(--ide-dim);text-align:right;user-select:none;border-right:1px solid var(--ide-line)}
.gut div{padding:0 10px 0 12px;min-width:38px}
.lines{padding:10px 0;min-width:0}
.ln{padding:0 14px;white-space:pre;min-height:26px;position:relative}
.ln.tap{cursor:pointer}
.ln.tap:hover{background:rgba(255,255,255,.04)}
.ln.sel{background:rgba(236,241,65,.16);box-shadow:inset 3px 0 0 var(--lime)}
.ln.badl{background:rgba(255,107,154,.18);box-shadow:inset 3px 0 0 #ff6b9a}
.ln.goodl{background:rgba(95,211,141,.18);box-shadow:inset 3px 0 0 #5fd38d}
.ind{display:inline-block;width:4ch;box-shadow:inset 1px 0 0 var(--ide-line);background:rgba(165,169,227,.06)}
.t-fn{color:var(--syn-fn)}.t-str{color:var(--syn-str)}.t-num{color:var(--syn-num)}.t-com{color:var(--syn-com);font-style:italic}.t-kw{color:var(--syn-kw)}.t-par{color:var(--syn-par)}
.blank{display:inline-block;min-width:5ch;border-bottom:2px dashed var(--lime);color:var(--lime);text-align:center}
.term{border-top:1px solid var(--ide-line);background:var(--ide-2);font-family:var(--f-code);font-size:14px;line-height:1.55;padding:8px 14px 10px}
.term .th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ide-dim);margin-bottom:2px}
.term pre{margin:0;white-space:pre-wrap;word-break:break-word;font:inherit}
.term .err{color:#ff8fb1}

/* keyboard editor */
.ed{position:relative;min-width:0}
.ed pre,.ed textarea{margin:0;padding:10px 14px;font-family:var(--f-code);font-size:15px;line-height:26px;white-space:pre;tab-size:4;border:0}
.ed pre{pointer-events:none;color:var(--ide-text);min-height:132px}
.ed textarea{position:absolute;inset:0;width:100%;height:100%;resize:none;background:transparent;color:transparent;caret-color:var(--lime);overflow:hidden;outline:none}
.ed textarea::selection{background:rgba(236,241,65,.3);color:transparent}
.ed-ph{position:absolute;left:14px;top:10px;color:var(--ide-dim);pointer-events:none;font-family:var(--f-code);font-size:15px;line-height:26px}
.keys{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--ide-2);border-top:1px solid var(--ide-line)}
.keys button{flex:none;border:1px solid var(--ide-line);background:var(--ide);color:var(--ide-text);font-family:var(--f-code);font-size:14px;border-radius:8px;padding:5px 11px}

.mode{display:flex;align-self:flex-start;background:var(--surface-2);border-radius:12px;padding:3px}
.mode button{border:0;background:none;border-radius:9px;padding:5px 12px;font-size:13px;font-weight:800;color:var(--ink-soft);display:flex;align-items:center;gap:6px}
.mode button svg{width:16px;height:16px}
.mode button[aria-pressed="true"]{background:var(--surface);color:var(--purple-ink);box-shadow:0 1px 3px rgba(38,43,105,.15)}

/* blocks */
.bank{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.chip{border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:12px;padding:6px 12px;font-family:var(--f-code);font-size:15px;color:var(--ink);transition:transform .08s}
.chip:active{transform:translateY(2px)}
.chip.used{visibility:hidden}
.chip.ide-chip{background:#2a2e6e;border-color:#3a3f8a;color:var(--ide-text)}
.ln .chip{padding:0 6px;font-size:14px;border-width:1px 1px 3px;margin-right:4px;line-height:20px;vertical-align:middle}
.ln.cur{background:rgba(165,169,227,.07)}
.btools{display:flex;gap:8px;flex-wrap:wrap}
.tool{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;color:var(--ink)}
.tool code{font-family:var(--f-code)}
.parsons .ln{cursor:pointer}

/* options */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:14px;padding:12px 14px;font-weight:600;display:flex;gap:12px;align-items:flex-start}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--ink-soft)}
.opt pre{margin:0;font-family:var(--f-code);font-size:14px;white-space:pre-wrap;line-height:1.45}
.opt[aria-pressed="true"]{border-color:var(--purple);background:var(--surface-2)}
.opt[aria-pressed="true"] .k{border-color:var(--purple);color:var(--purple-ink)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}

/* footer */
.lfoot{border-top:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--bg);transition:background .2s}
.lfoot-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.lfoot.good{background:var(--good-bg);border-color:transparent}
.lfoot.bad{background:var(--bad-bg);border-color:transparent}
.fb{display:flex;gap:12px;align-items:flex-start}
.fb img{width:56px;flex:none}
.fb h3{margin:0;font-family:var(--f-display);font-size:24px;line-height:1.1}
.lfoot.good .fb h3{color:var(--good)}.lfoot.bad .fb h3{color:var(--bad)}
.fb p{margin:2px 0 0;font-size:15px}
.fb p code{font-family:var(--f-code);font-size:.9em}
.main{width:100%;border:0;border-radius:14px;padding:13px;font-weight:800;font-size:16px;letter-spacing:.06em;text-transform:uppercase;background:var(--purple);color:#fff;box-shadow:0 5px 0 #2f1873}
.main:active{transform:translateY(3px);box-shadow:0 2px 0 #2f1873}
.main:disabled{background:var(--surface-2);color:var(--ink-soft);box-shadow:0 5px 0 var(--line);cursor:default}
.lfoot.good .main{background:var(--good);box-shadow:0 5px 0 #1d6b3c}
.lfoot.bad .main{background:var(--bad);box-shadow:0 5px 0 #92204a}

/* finish */
.finish{align-items:center;text-align:center;justify-content:center}
.finish h2{font-family:var(--f-display);font-size:40px;line-height:1;margin:0;text-transform:uppercase}
.fstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.fstats div{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 6px}
.fstats b{display:block;font-family:var(--f-display);font-size:28px;line-height:1.1;color:var(--purple-ink);font-variant-numeric:tabular-nums}
.fstats small{font-size:12px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em}
.story{position:relative;width:100%;max-width:320px;aspect-ratio:9/12;border-radius:22px;background:#512da8;color:#fff;overflow:hidden;text-align:left;padding:20px}
.story .s1{font-family:var(--f-accent);font-size:24px;color:#ecf141}
.story .s2{max-width:62%;font-family:var(--f-display);font-size:32px;line-height:1.02;text-transform:uppercase;margin-top:6px}
.story .s3{position:absolute;left:20px;bottom:18px;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#cfeb62}
.story img{position:absolute;right:-30px;bottom:-24px;width:58%}
.story .zz{position:absolute;left:20px;bottom:48px;width:40%;height:auto}
.unlock{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--lime-2);border-radius:14px;padding:10px 14px;text-align:left;width:100%}
.unlock .ic{width:44px;height:44px;border-radius:50%;background:var(--lime);color:#512da8;display:grid;place-items:center;flex:none}
.unlock .ic svg{width:24px;height:24px}
.unlock small{display:block;color:var(--ink-soft);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:40;max-width:calc(100% - 32px);text-align:center}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- Спидран: аркадный раздел, свои фиксированные цвета в обеих темах ---------- */
:root{ --sr-bg:#1b1e52; --sr-bg-2:#262b69; --sr-line:#3a3f8a; --sr-text:#f3f2ff; --sr-dim:#a5a9e3; --sr-lime:#ecf141; --sr-purple:#512da8; --sr-pink:#ff6b9a;
  --f-pixel:"Press Start 2P","Courier New",monospace; }
.sr-hero{position:relative;background:var(--sr-bg);color:var(--sr-text);border-radius:22px;padding:18px;overflow:hidden;display:flex;flex-direction:column;gap:14px;
  background-image:linear-gradient(var(--sr-line) 1px,transparent 1px),linear-gradient(90deg,var(--sr-line) 1px,transparent 1px);background-size:22px 22px;background-position:-1px -1px}
.sr-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(27,30,82,.55),rgba(27,30,82,.92));pointer-events:none}
.sr-hero>*{position:relative;z-index:1}
.sr-title{font-family:var(--f-pixel);font-size:26px;line-height:1.2;color:var(--sr-lime);letter-spacing:.02em;text-shadow:3px 3px 0 var(--sr-purple)}
.sr-sub{margin:0;font-size:14px;color:var(--sr-text);max-width:min(26ch,68%)}
.sr-sub b{color:var(--sr-lime)}
.sr-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sr-stat{background:rgba(255,255,255,.06);border:2px solid var(--sr-line);border-radius:12px;padding:8px 10px;min-width:0}
.sr-stat b{display:block;font-family:var(--f-pixel);font-size:14px;line-height:1.5;color:var(--sr-lime);font-variant-numeric:tabular-nums;white-space:nowrap}
.sr-stat small{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sr-dim)}
.sr-hero img{position:absolute;right:-22px;top:-6px;width:104px;z-index:1;transform:rotate(8deg)}
.sr-h{font-family:var(--f-display);font-size:26px;line-height:1.1;margin:4px 0 -6px;text-transform:uppercase}
.sr-levels{display:flex;flex-direction:column;gap:10px}
.sr-lvl{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:12px;text-align:left;width:100%;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:10px 12px;color:var(--ink)}
.sr-lvl .spr{width:56px;height:56px;border-radius:12px;background:var(--sr-bg);display:grid;place-items:center}
.sr-lvl .spr svg{width:42px;height:42px;image-rendering:pixelated}
.sr-lvl .t{min-width:0}
.sr-lvl .t small{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--purple-ink)}
.sr-lvl .t b{display:block;font-size:17px;line-height:1.2}
.sr-lvl .t span{display:block;font-size:13px;color:var(--ink-soft);line-height:1.3}
.sr-chip{font-weight:800;font-size:12px;border-radius:9px;padding:5px 9px;white-space:nowrap;background:var(--surface-2);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.sr-lvl.open{border-color:var(--purple)}
.sr-lvl.open .sr-chip{background:var(--purple);color:#fff}
.sr-lvl.done .sr-chip{background:var(--lime);color:#262b69}
.sr-lvl.locked{opacity:.75}
.sr-lvl.boss{background:var(--sr-bg);border-color:var(--sr-line);color:var(--sr-text)}
.sr-lvl.boss .t small{color:var(--sr-lime)}.sr-lvl.boss .t span{color:var(--sr-dim)}
.sr-board{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sr-row{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.sr-row:last-child{border-bottom:0}
.sr-row .pos{font-family:var(--f-pixel);font-size:12px;color:var(--ink-soft);text-align:center}
.sr-row.top .pos{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#262b69}
.sr-row.p1 .pos{background:#ecf141}.sr-row.p2 .pos{background:#cfeb62}.sr-row.p3 .pos{background:#a5a9e3}
.sr-row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.sr-row .pt{font-family:var(--f-pixel);font-size:12px}
.sr-row.me{background:var(--surface-2)}
.sr-row.gap{grid-template-columns:1fr;text-align:center;color:var(--ink-soft);padding:4px}
.sr-prize{padding:8px 14px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--good);background:var(--good-bg)}
.sr-rules{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.sr-rules summary{font-weight:800;cursor:pointer}
.sr-rules ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.sr-note{background:var(--surface);border:2px dashed var(--line);border-radius:var(--r);padding:14px 16px;font-size:14px}
.sr-loading{display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-weight:700;padding:30px 0;justify-content:center}
.sr-loading i{width:10px;height:10px;background:var(--purple);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.num-in{font-family:var(--f-code);font-size:22px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:100%;max-width:260px}
.num-in:focus{outline:3px solid var(--lime);border-color:var(--purple)}
.ege-line{display:block;margin-top:6px;font-size:13px;font-weight:700;opacity:.85}
.sr-result{font-family:var(--f-pixel);font-size:40px;line-height:1.2;color:var(--purple-ink)}
.tabs button.sr-tab svg{width:24px;height:24px}

/* ---------- tiny Python subset: print() with strings, numbers, + - * / // % ** ---------- */
function PyErr(type,msg,line){ this.type=type; this.msg=msg; this.line=line; }
function tokenize(src, ln){
  const t=[]; let i=0;
  while(i<src.length){
    const c=src[i];
    if(c===" "||c==="\t"){i++;continue}
    if(c==="#") break;
    if(c==='"'||c==="'"){ let j=i+1; while(j<src.length&&src[j]!==c) j++;
      if(j>=src.length) throw new PyErr("SyntaxError","unterminated string literal (detected at line "+ln+")",ln);
      t.push({k:"str",v:src.slice(i+1,j)}); i=j+1; continue; }
    if(/[0-9]/.test(c)){ let m=src.slice(i).match(/^[0-9]+(\.[0-9]+)?/); t.push({k:"num",v:Number(m[0]),f:!!m[1]}); i+=m[0].length; continue; }
    if(/[A-Za-zА-Яа-яЁё_]/.test(c)){ let m=src.slice(i).match(/^[A-Za-zА-Яа-яЁё_0-9]+/); t.push({k:"id",v:m[0]}); i+=m[0].length; continue; }
    const two=src.substr(i,2);
    if(two==="//"||two==="**"){ t.push({k:"op",v:two}); i+=2; continue; }
    if("()+-*/%,=".includes(c)){ t.push({k:"op",v:c}); i++; continue; }
    if("«»“”".includes(c)) throw new PyErr("SyntaxError","invalid character '"+c+"' (U+"+c.charCodeAt(0).toString(16).toUpperCase().padStart(4,"0")+")",ln);
    throw new PyErr("SyntaxError","invalid syntax",ln);
  }
  return t;
}
function fmt(v){ if(v.t==="str") return v.v; if(v.t==="float"){ return Number.isInteger(v.v)? v.v.toFixed(1) : String(v.v); } return String(v.v); }
function tname(v){ return v.t; }
function runPy(code){
  const out=[]; const lines=code.replace(/\t/g,"    ").split("\n");
  try{
    lines.forEach((raw,idx)=>{
      const ln=idx+1; const s=raw.replace(/\s+$/,"");
      if(!s.trim()||s.trim().startsWith("#")) return;
      if(/^\s/.test(s)) throw new PyErr("IndentationError","unexpected indent",ln);
      const T=tokenize(s,ln); let p=0;
      const peek=()=>T[p], next=()=>T[p++];
      const isOp=v=>T[p]&&T[p].k==="op"&&T[p].v===v;
      function atom(){
        const t=next();
        if(!t) throw new PyErr("SyntaxError","invalid syntax",ln);
        if(t.k==="str") return {t:"str",v:t.v};
        if(t.k==="num") return {t:t.f?"float":"int",v:t.v};
        if(t.k==="op"&&t.v==="("){ const v=expr(); if(!isOp(")")) throw new PyErr("SyntaxError","'(' was never closed",ln); p++; return v; }
        if(t.k==="id") throw new PyErr("NameError","name '"+t.v+"' is not defined",ln);
        throw new PyErr("SyntaxError","invalid syntax",ln);
      }
      function factor(){
        if(isOp("-")){ p++; const v=factor(); if(v.t==="str") throw new PyErr("TypeError","bad operand type for unary -: 'str'",ln); return {t:v.t,v:-v.v}; }
        const a=atom();
        if(isOp("**")){ p++; const b=factor(); return arith(a,"**",b); }
        return a;
      }
      function term(){ let a=factor(); while(T[p]&&T[p].k==="op"&&["*","/","//","%"].includes(T[p].v)){ const o=next().v; a=arith(a,o,factor()); } return a; }
      function expr(){ let a=term(); while(isOp("+")||isOp("-")){ const o=next().v; a=arith(a,o,term()); } return a; }
      function arith(a,o,b){
        if(a.t==="str"||b.t==="str"){
          if(o==="+"&&a.t==="str"&&b.t==="str") return {t:"str",v:a.v+b.v};
          if(o==="*"&&((a.t==="str"&&b.t==="int")||(a.t==="int"&&b.t==="str"))){ const s=a.t==="str"?a:b, n=a.t==="str"?b:a; return {t:"str",v:n.v>0?s.v.repeat(n.v):""}; }
          if(o==="+"&&a.t==="str") throw new PyErr("TypeError",'can only concatenate str (not "'+tname(b)+'") to str',ln);
          throw new PyErr("TypeError","unsupported operand type(s) for "+o+": '"+tname(a)+"' and '"+tname(b)+"'",ln);
        }
        const fl=a.t==="float"||b.t==="float";
        if((o==="/"||o==="//"||o==="%")&&b.v===0) throw new PyErr("ZeroDivisionError","division by zero",ln);
        if(o==="+") return {t:fl?"float":"int",v:a.v+b.v};
        if(o==="-") return {t:fl?"float":"int",v:a.v-b.v};
        if(o==="*") return {t:fl?"float":"int",v:a.v*b.v};
        if(o==="/") return {t:"float",v:a.v/b.v};
        if(o==="//") return {t:fl?"float":"int",v:Math.floor(a.v/b.v)};
        if(o==="%") return {t:fl?"float":"int",v:((a.v%b.v)+b.v)%b.v};
        if(o==="**") return {t:fl?"float":"int",v:Math.pow(a.v,b.v)};
      }
      const f=next();
      if(!f) return;
      if(f.k!=="id"){ throw new PyErr("SyntaxError","invalid syntax",ln); }
      if(f.v!=="print"){ if(isOp("(")) throw new PyErr("NameError","name '"+f.v+"' is not defined",ln); throw new PyErr("SyntaxError","invalid syntax",ln); }
      if(!isOp("(")){ throw new PyErr("SyntaxError","Missing parentheses in call to 'print'. Did you mean print(...)?",ln); }
      p++; const args=[]; let sep=" ", end="\n";
      while(!isOp(")")){
        if(!peek()) throw new PyErr("SyntaxError","'(' was never closed",ln);
        if(peek().k==="id"&&T[p+1]&&T[p+1].k==="op"&&T[p+1].v==="="){
          const name=next().v; p++; const v=expr();
          if(name==="sep") sep=fmt(v); else if(name==="end") end=fmt(v);
          else throw new PyErr("TypeError","'"+name+"' is an invalid keyword argument for print()",ln);
        } else args.push(expr());
        if(isOp(",")){ p++; continue; }
        if(!isOp(")")) throw new PyErr("SyntaxError","invalid syntax. Perhaps you forgot a comma?",ln);
      }
      p++;
      if(p<T.length) throw new PyErr("SyntaxError","invalid syntax",ln);
      out.push(args.map(fmt).join(sep)+end);
    });
  }catch(e){
    if(e instanceof PyErr) return {out:out.join(""),err:e};
    return {out:out.join(""),err:new PyErr("SyntaxError","invalid syntax",1)};
  }
  return {out:out.join(""),err:null};
}

/* ---------- highlighting ---------- */
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
const KW=new Set(["if","else","elif","for","while","in","def","return","and","or","not","True","False","None","import","from"]);
const BI=new Set(["print","input","int","str","float","len","range","sum","min","max"]);
function hl(line){
  const m=line.match(/^( *)/)[1].length; let html="";
  const full=Math.floor(m/4); for(let i=0;i<full;i++) html+='<span class="ind">    </span>';
  let rest=line.slice(full*4);
  const re=/(#.*$)|("[^"]*"?|'[^']*'?)|(\b\d+(?:\.\d+)?\b)|([A-Za-zА-Яа-яЁё_][\wА-Яа-яЁё]*)|([()\[\]{}])|([^#"'\w()\[\]{}А-Яа-яЁё]+)/g;
  let mm; while((mm=re.exec(rest))){
    if(mm[1]) html+='<span class="t-com">'+esc(mm[1])+'</span>';
    else if(mm[2]) html+='<span class="t-str">'+esc(mm[2])+'</span>';
    else if(mm[3]) html+='<span class="t-num">'+mm[3]+'</span>';
    else if(mm[4]) html+= BI.has(mm[4])?'<span class="t-fn">'+mm[4]+'</span>':KW.has(mm[4])?'<span class="t-kw">'+mm[4]+'</span>':esc(mm[4]);
    else if(mm[5]) html+='<span class="t-par">'+mm[5]+'</span>';
    else html+=esc(mm[6]||mm[0]);
    if(re.lastIndex===mm.index) re.lastIndex++;
  }
  return html;
}

const $=s=>document.querySelector(s);
function h(tag,attrs,html){ const e=document.createElement(tag); if(attrs) for(const k in attrs){ if(k==="class") e.className=attrs[k]; else if(k.startsWith("on")) e.addEventListener(k.slice(2),attrs[k]); else e.setAttribute(k,attrs[k]); } if(html!=null) e.innerHTML=html; return e; }

function daysToEge(){ const ege=new Date(2027,5,1); return Math.max(0,Math.ceil((ege-new Date())/864e5)); }

/* IDE window: readonly, optional tap lines, optional run */
function ideView(code,opts){
  opts=opts||{};
  const w=h("div",{class:"ide"});
  const bar=h("div",{class:"ide-bar"},'<span class="dots"><i></i><i></i><i></i></span><span class="file">main.py</span>');
  w.appendChild(bar);
  const body=h("div",{class:"code"}); const gut=h("div",{class:"gut"}); const lines=h("div",{class:"lines"});
  const src=code.split("\n");
  src.forEach((l,i)=>{ gut.appendChild(h("div",null,String(i+1)));
    let html=hl(l).replace("@@BLANK@@",'<span class="blank">?</span>');
    if(l.includes("@@BLANK@@")) html=hl(l.replace("@@BLANK@@","")).replace(/^/,'<span class="blank">?</span>');
    const ln=h("div",{class:"ln"},html||" "); if(opts.onTap){ ln.classList.add("tap"); ln.tabIndex=0; ln.setAttribute("role","button"); ln.addEventListener("click",()=>opts.onTap(i,ln)); ln.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();opts.onTap(i,ln);}}); }
    lines.appendChild(ln); });
  body.append(gut,lines); w.appendChild(body);
  const term=h("div",{class:"term"}); term.hidden=true; w.appendChild(term);
  w.showRun=function(c){ const r=runPy(c==null?code:c); showTerm(term,r); return r; };
  if(opts.run){ const b=h("button",{class:"run",type:"button"},I.play+"Запустить"); b.onclick=()=>w.showRun(); bar.appendChild(b); }
  w.lineEls=[...lines.children];
  return w;
}
function showTerm(term,r){
  term.hidden=false;
  let html='<div class="th">Вывод</div><pre>'+esc(r.out.replace(/\n$/,""))+'</pre>';
  if(r.err) html+='<pre class="err">'+(r.out?"\n":"")+'Строка '+r.err.line+'\n'+esc(r.err.type+": "+r.err.msg)+'</pre>';
  if(!r.out&&!r.err) html+='<pre style="opacity:.6">(пусто)</pre>';
  term.innerHTML=html;
}

/* ---------- lesson engine ---------- */
let LS=null;
function startLesson(p){
  LS={p, queue:p.steps.map((s,i)=>Object.assign({_i:i},s)), pos:0, mistakes:0, redo:new Set(), xp:0, t0:Date.now(), bugFound:false};
  const el=$("#lesson"); el.hidden=false; document.body.style.overflow="hidden";
  el.innerHTML='<div class="lesson-in"><div class="lhead"><button class="x" type="button" aria-label="Выйти из урока">'+I.close+'</button><div class="prog"><i></i></div></div><div class="lbody" id="lbody"></div></div><div class="lfoot" id="lfoot"><div class="lfoot-in" id="lfoot-in"></div></div>';
  el.querySelector(".x").onclick=closeLesson;
  showStep();
}
function closeLesson(){ $("#lesson").hidden=true; document.body.style.overflow=""; LS=null; render(); }
function setProg(){ $("#lesson .prog i").style.width=(LS.pos/LS.queue.length*100)+"%"; }

function footer(state,opts){
  const f=$("#lfoot"), fi=$("#lfoot-in"); f.className="lfoot"+(state?" "+state:""); fi.innerHTML="";
  if(state){
    const fb=h("div",{class:"fb"},'<img src="'+CAT+'" alt=""><div><h3>'+opts.head+'</h3>'+(opts.text?'<p>'+opts.text+'</p>':"")+'</div>');
    fi.appendChild(fb);
  }
  const b=h("button",{class:"main",type:"button"},opts.btn); if(opts.disabled) b.disabled=true; b.onclick=opts.on; fi.appendChild(b);
  return b;
}
const PRAISE=["Отлично!","Так держать!","Верно!","Мур, правильно!","Супер!"];
function resolve(ok,step,detail){
  if(ok){ haptic("success"); if(!step._again) LS.xp+=10; else LS.xp+=5; footer("good",{head:PRAISE[Math.floor(Math.random()*PRAISE.length)],text:step.why,btn:"Дальше",on:nextStep}); }
  else { haptic("error"); LS.mistakes++; if(!LS.redo.has(step._i)){ LS.redo.add(step._i); LS.queue.push(Object.assign({},step,{_again:true})); setProg(); }
    footer("bad",{head:"Почти!",text:(detail?detail+" ":"")+step.why+(step._again?"":" Вернёмся к этому заданию в конце урока."),btn:"Понятно",on:nextStep});
    const lb=$("#lbody"); lb.classList.remove("shake"); void lb.offsetWidth; lb.classList.add("shake"); }
}
function nextStep(){ LS.pos++; if(LS.pos>=LS.queue.length) finish(); else showStep(); }

function showStep(){
  setProg();
  const st=LS.queue[LS.pos], b=$("#lbody"); b.innerHTML=""; b.scrollTop=0;
  b.appendChild(h("div",{class:"kind"},st.kind+(st._again?' <span class="again">Повторим</span>':"")));
  b.appendChild(h("h2",{class:"q"},st.title));
  ({theory,choice,build,bug,indent,parsons,write})[st.type](st,b);
}

function theory(st,b){
  st.text.forEach(t=>b.appendChild(h("p",{class:"txt"},t)));
  if(st.code) b.appendChild(ideView(st.code,{run:st.run}));
  if(st.tip) b.appendChild(h("div",{class:"tip"},'<img src="'+CAT+'" alt="Инфик"><p>'+st.tip+'</p>'));
  footer(null,{btn:"Дальше",on:()=>{ LS.xp+=0; nextStep(); }});
}
function choice(st,b){
  if(st.code){ const v=ideView(st.code,{}); b.appendChild(v); if(st.showRun) v.showRun(); }
  const box=h("div",{class:"opts"}); let sel=null, done=false;
  const order=st.options.map((o,i)=>i);
  const btns=order.map((oi,k)=>{ const o=st.options[oi];
    const inner=typeof o==="string"?esc(o):o.out!=null?'<pre>'+esc(o.out)+'</pre>':'<code>'+esc(o.code)+'</code>';
    const btn=h("button",{class:"opt",type:"button","aria-pressed":"false"},'<span class="k">'+(k+1)+'</span><span>'+inner+'</span>');
    btn.onclick=()=>{ if(done) return; sel=oi; btns.forEach(x=>x.setAttribute("aria-pressed","false")); btn.setAttribute("aria-pressed","true"); chk.disabled=false; };
    box.appendChild(btn); return btn; });
  b.appendChild(box);
  const chk=footer(null,{btn:"Проверить",disabled:true,on:()=>{ done=true; const ok=sel===st.answer;
    btns[order.indexOf(st.answer)].classList.add("ok"); if(!ok) btns[order.indexOf(sel)].classList.add("no"); resolve(ok,st); }});
}
function bug(st,b){
  let sel=null, done=false;
  const v=ideView(st.code,{onTap:(i,ln)=>{ if(done) return; sel=i; v.lineEls.forEach(x=>x.classList.remove("sel")); ln.classList.add("sel"); chk.disabled=false; }});
  b.appendChild(v);
  b.appendChild(h("div",{class:"tip"},'<img src="'+CAT+'" alt="Инфик"><p>Смотри внимательно на кавычки и скобки. <em>Баги любят прятаться.</em></p>'));
  const chk=footer(null,{btn:"Проверить",disabled:true,on:()=>{ done=true; const ok=sel+1===st.bug;
    v.lineEls[st.bug-1].classList.remove("sel"); v.lineEls[st.bug-1].classList.add(ok?"goodl":"badl"); if(!ok) v.lineEls[sel].classList.replace("sel","badl");
    v.showRun(); if(ok) LS.bugFound=true; resolve(ok,st); }});
}
function indent(st,b){
  const lines=st.code.split("\n"); let sel=null, done=false;
  const wrap=h("div"); b.appendChild(wrap);
  const tools=h("div",{class:"btools"});
  const dedent=h("button",{class:"tool",type:"button"},"<code>⇤</code> Убрать отступ");
  const ind=h("button",{class:"tool",type:"button"},"<code>⇥</code> Добавить отступ");
  tools.append(dedent,ind); b.appendChild(tools);
  b.appendChild(h("p",{class:"note"},"Нажми на строку, потом на кнопку."));
  function draw(){ wrap.innerHTML=""; const v=ideView(lines.join("\n"),{run:true,onTap:(i)=>{ if(done) return; sel=i; draw(); }}); if(sel!=null) v.lineEls[sel].classList.add("sel"); wrap.appendChild(v); wrap.v=v; }
  dedent.onclick=()=>{ if(sel==null||done) return toast("Сначала выбери строку"); lines[sel]=lines[sel].replace(/^ {1,4}/,""); draw(); };
  ind.onclick=()=>{ if(sel==null||done) return toast("Сначала выбери строку"); lines[sel]="    "+lines[sel]; draw(); };
  draw();
  footer(null,{btn:"Проверить",on:()=>{ done=true; const r=wrap.v.showRun(lines.join("\n")); resolve(!r.err&&r.out===st.expect,st, r.err?"Python всё ещё ругается: "+r.err.type+".":""); }});
}
function parsons(st,b){
  const shuffled=st.lines.map((l,i)=>({l,i})); const ans=[];
  const out=h("div"); const bank=h("div",{class:"bank"});
  b.append(out,h("p",{class:"note"},"Нажимай на строки в нужном порядке. Нажми на строку в редакторе, чтобы убрать её."),bank);
  let chk;
  function draw(){
    out.innerHTML="";
    const src=ans.length?ans.map(a=>a.l).join("\n"):"";
    const v=ideView(src||" ",{run:ans.length>0,onTap:(i)=>{ if(!ans.length) return; ans.splice(i,1); draw(); }});
    if(!ans.length){ v.lineEls[0].innerHTML='<span style="color:var(--ide-dim)">Сюда встанут строки…</span>'; v.querySelector(".gut").innerHTML="<div>1</div>"; }
    out.appendChild(v); out.v=v;
    bank.innerHTML="";
    shuffled.forEach(s=>{ const c=h("button",{class:"chip ide-chip"+(ans.includes(s)?" used":""),type:"button"},hl(s.l)); c.onclick=()=>{ ans.push(s); draw(); }; bank.appendChild(c); });
    if(chk) chk.disabled=ans.length!==st.lines.length;
  }
  chk=footer(null,{btn:"Проверить",disabled:true,on:()=>{ const r=out.v.showRun(ans.map(a=>a.l).join("\n")); resolve(!r.err&&r.out===st.expect,st); }});
  draw();
}

function joinTokens(ts){ let s=""; ts.forEach((t,i)=>{ if(i>0){ const p=ts[i-1]; if(!(p==="("||t===")"||t===","||t==="("||p==="'"||t==="'")) s+=" "; } s+=t; }); return s; }
function codeEntry(b,st,onChange){

      function ins(txt){ const s=ta.selectionStart,e=ta.selectionEnd; ta.setRangeText(txt,s,e,"end"); sync(); ta.focus(); }
      ta.addEventListener("input",sync);
      ta.addEventListener("keydown",e=>{
        if(e.key==="Tab"){ e.preventDefault(); if(e.shiftKey){ const s=ta.selectionStart; const ls=ta.value.lastIndexOf("\n",s-1)+1; if(ta.value.substr(ls,4)==="    "){ ta.setRangeText("",ls,ls+4,"preserve"); sync(); } } else ins("    "); }
        else if(e.key==="Enter"){ e.preventDefault(); const s=ta.selectionStart; const ls=ta.value.lastIndexOf("\n",s-1)+1; const line=ta.value.slice(ls,s); let ind=line.match(/^ */)[0]; if(/:\s*$/.test(line)) ind+="    "; ins("\n"+ind); }

/* --- связь с сервером --- */
async function api(action, payload){
  if(!API_URL) return demoApi(action, payload||{});
  const body=JSON.stringify(Object.assign({action, initData:(tg&&tg.initData)||""}, payload||{}));
  let lastErr;
  for(let i=0;i<3;i++){
    try{
      const r=await fetch(API_URL,{method:"POST",body,headers:{"Content-Type":"text/plain;charset=utf-8"}});
      const j=await r.json(); if(j.error) throw Object.assign(new Error(j.error),{server:true}); return j;
    }catch(e){ lastErr=e; if(e.server) break; await new Promise(res=>setTimeout(res,700*(i+1))); }
  }
  throw lastErr;
}

const DEMO={ prog:{}, rivals:[["Даня К.",230],["Алиса",210],["Max_coder",180],["Соня В.",150],["Тимур",120],["Ева",90],["Артём",60],["Лиза П.",40],["Гоша",20],["Вика",10],["Рома",10]] };
function demoQ(day,n){ const q=(window.SPEEDRUN_Q||[]).find(x=>x.day===day&&x.n===n); return q&&Object.assign({type:q.type,out:q.out,ege:q.ege},q.v[0]); }
function demoTotal(){ let t=0; Object.values(DEMO.prog).forEach(d=>Object.values(d).forEach(a=>t+=a.pts)); return t; }
function demoApi(action,p){
  return new Promise(res=>setTimeout(()=>{
    const Q=window.SPEEDRUN_Q||[];
    if(action==="state"){
      const me={name:(TG_USER&&TG_USER.first_name)||"Ты",total:demoTotal()};
      const all=DEMO.rivals.map(r=>({name:r[0],total:r[1]})).concat([Object.assign({me:true},me)]).sort((a,b)=>b.total-a.total);

    } else if(action==="start"){

}

    inp.addEventListener("input",()=>chk.disabled=!inp.value.trim());
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"&&inp.value.trim()) chk.click(); });
    b.appendChild(inp); getAnswer=()=>inp.value.trim();
    setTimeout(()=>inp.focus(),50);
  } else {
    const box=h("div",{class:"opts"}); let sel=null;
    const btns=q.opts.map((o,k)=>{ const inner=q.out?'<pre>'+esc(o)+'</pre>':(/[()=%"]/.test(o)?'<code>'+esc(o)+'</code>':esc(o));
      const btn=h("button",{class:"opt",type:"button","aria-pressed":"false"},'<span class="k">'+(k+1)+'</span><span>'+inner+'</span>');
      btn.onclick=()=>{ if(chk.dataset.busy) return; sel=o; btns.forEach(x=>x.setAttribute("aria-pressed","false")); btn.setAttribute("aria-pressed","true"); chk.disabled=false; };
      box.appendChild(btn); return btn; });
    b.appendChild(box); getAnswer=()=>sel; q._btns=btns;
  }
  chk=footer(null,{btn:"Проверить",disabled:true,on:async()=>{
    if(chk.dataset.busy) return; chk.dataset.busy=1; chk.disabled=true; chk.textContent="Проверяем…";
    const choice=getAnswer();
    try{
      const r=await api("answer",{day:SR.day,n:q.n,choice});
      if(q._btns){ q._btns.forEach((x,i)=>{ if(q.opts[i]===r.correct) x.classList.add("ok"); else if(q.opts[i]===choice&&!r.ok) x.classList.add("no"); }); }
      if(r.ok) SR.right++;
      haptic(r.ok?"success":"error");
      const text=(r.ok?"":"Верный ответ: <b>"+esc(r.correct)+"</b>. ")+esc(r.explain||"")+(r.ege?'<span class="ege-line">'+esc(r.ege)+'</span>':"");
      footer(r.ok?"good":"bad",{head:r.ok?"+"+r.points+" очков!":"Мимо",text,btn:"Дальше",on:()=>{ SR.pos++; srShow(); }});
    }catch(e){ delete chk.dataset.busy; chk.disabled=false; chk.textContent="Проверить"; toast(e.message||"Нет связи. Попробуй ещё раз"); }
  }});
}
function srFinish(){
  const b=$("#lbody"), meta=SR_DAYS[SR.day-1]; b.innerHTML=""; b.classList.add("finish");
  $("#lesson .prog i").style.width="100%";
  b.appendChild(h("div",{class:"spr",style:"width:96px;height:96px;background:#1b1e52;border-radius:20px;display:grid;place-items:center"},sprite(meta.spr).replace("<svg",'<svg width="72" height="72"')));
  b.appendChild(h("h2",null,meta.final?"Босс повержен!":"Уровень пройден!"));
  b.appendChild(h("div",{class:"sr-result"},SR.right+"/"+SR.qs.length));
  b.appendChild(h("p",{class:"txt",style:"text-align:center"},meta.final?"Ты решил задания в духе настоящего ЕГЭ. Итоги забега — 2 ноября в канале.":"Следующий уровень откроется завтра. Загляни в таблицу лидеров!"));
  footer(null,{btn:"К таблице лидеров",on:()=>{ b.classList.remove("finish"); closeSpeed(); }});
}

if(Date.now()<new Date(2026,10,3).getTime()) S.tab="speed";
render();
})();
</script>
